<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Obsidian Secrets KDF benchmark</title>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; }
  button { font: inherit; padding: .6rem 1rem; }
  pre { white-space: pre-wrap; background: #f3f3f3; padding: 1rem; }
</style>
<h1>KDF benchmark</h1>
<p>This uses dummy values only. Run it on the target Android phone and keep the result for the release notes.</p>
<button id="run">Run benchmark</button>
<pre id="output">Not run.</pre>
<script>
  const candidates = [600000, 900000, 1200000, 1500000, 2000000];
  const output = document.querySelector("#output");
  document.querySelector("#run").addEventListener("click", async () => {
    if (!globalThis.crypto?.subtle) {
      output.textContent = "Web Crypto is unavailable. Open this page in a current browser over HTTPS or localhost.";
      return;
    }
    output.textContent = "Running...";
    const enc = new TextEncoder();
    const key = await crypto.subtle.importKey("raw", enc.encode("benchmark-only-password"), "PBKDF2", false, ["deriveBits"]);
    const salt = enc.encode("benchmark-only-salt");
    const results = [];
    for (const iterations of candidates) {
      const start = performance.now();
      await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations, hash: "SHA-256" }, key, 256);
      results.push({ iterations, milliseconds: Math.round((performance.now() - start) * 100) / 100 });
      output.textContent = JSON.stringify({ device: navigator.userAgent, results }, null, 2);
    }
  });
</script>
