name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PNPM_VERSION: 11.5.0
  NODE_VERSION: 22

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build plugin bundle
        run: pnpm run build:plugin

      - name: Build release archive
        run: pnpm run archive

      - name: Verify release files
        run: |
          test -s main.js
          test -s manifest.json
          test -s styles.css
          test -s dist/main.js
          test -s dist/manifest.json
          test -s dist/styles.css
          test -s dist/obsidian-secrets-v*.zip
          test -s dist/CHECKSUMS.txt
          grep -q "${GITHUB_SHA}" main.js
          ls -lh main.js manifest.json styles.css dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-secrets-dist
          path: dist/
          retention-days: 30

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: obsidian-secrets-dist
          path: dist

      - name: Publish rolling dev or stable release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref == 'refs/heads/main' && 'dev' || github.ref_name }}
          name: ${{ github.ref == 'refs/heads/main' && 'Dev Build' || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref == 'refs/heads/main' }}
          draft: false
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/v') }}
          body: |
            ${{ github.ref == 'refs/heads/main' && 'Latest development build from `main`.' || 'Stable release.' }}

            - Commit: `${{ github.sha }}`
            - Branch/tag: `${{ github.ref_name }}`
          files: |
            dist/obsidian-secrets-v*.zip
            dist/main.js
            dist/manifest.json
            dist/styles.css
            dist/CHECKSUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
